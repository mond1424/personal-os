import java.security.KeyStore
import java.security.MessageDigest

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def formatSha256 = { byte[] digest ->
    digest.collect { String.format('%02X', it & 0xff) }.join(':')
}

def keystoreSha256 = { File keystoreFile, String password, String alias ->
    Exception lastFailure = null
    for (String storeType : ['PKCS12', 'JKS']) {
        try {
            def keystore = KeyStore.getInstance(storeType)
            keystoreFile.withInputStream { stream ->
                keystore.load(stream, password.toCharArray())
            }
            def certificate = keystore.getCertificate(alias)
            if (certificate == null) {
                throw new GradleException("release signing alias was not found in the keystore")
            }
            return formatSha256(MessageDigest.getInstance('SHA-256').digest(certificate.encoded))
        } catch (Exception failure) {
            lastFailure = failure
        }
    }
    throw new GradleException("release keystore certificate could not be read", lastFailure)
}

android {
    namespace = "dev.mond1424.personalos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.mond1424.personalos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // 자격증명은 두 경로 중 하나. 파일이 있으면 파일이 이긴다.
            //   ① android/keystore.properties  (권장 — Windows에서 특수문자 안전. .gitignore 처리됨)
            //   ② 환경변수 POS_*               (CI·다른 기계용)
            def props = new Properties()
            def propFile = rootProject.file("keystore.properties")
            if (propFile.exists()) {
                propFile.withInputStream { props.load(it) }
            }

            def pick = { String key, String env ->
                def v = props.getProperty(key) ?: System.getenv(env)
                return v?.trim()   // 따옴표 앞 공백·개행이 붙는 사고가 잦다
            }

            def ksPath = pick("storeFile",     "POS_KEYSTORE")
            def ksPass = pick("storePassword", "POS_KEYSTORE_PASSWORD")
            def kAlias = pick("keyAlias",      "POS_KEY_ALIAS")
            def kPass  = pick("keyPassword",   "POS_KEY_PASSWORD")

            // 자격증명이 없으면 여기서 멈춘다.
            // 없는 채로 두면 gradle이 조용히 디버그 키로 서명해 버리고,
            // 그렇게 만든 APK는 나중에 릴리스 키 APK로 업데이트할 수 없다.
            if (!ksPath || !ksPass || !kAlias || !kPass) {
                throw new GradleException(
                    "서명 자격증명이 없습니다. android/keystore.properties 를 만들거나 " +
                    "POS_KEYSTORE · POS_KEYSTORE_PASSWORD · POS_KEY_ALIAS · POS_KEY_PASSWORD 를 설정하세요."
                )
            }

            def ksFile = file(ksPath)
            if (!ksFile.exists()) {
                throw new GradleException("keystore를 찾을 수 없습니다: ${ksFile.absolutePath}")
            }

            // 진단용 — 비밀번호는 찍지 않고 길이만. 오타·공백 혼입을 눈으로 잡는다
            logger.lifecycle("[signing] keystore=${ksFile.name} alias=${kAlias} " +
                             "storePassword.length=${ksPass.length()} keyPassword.length=${kPass.length()}")

            storeFile     ksFile
            storePassword ksPass
            keyAlias      kAlias
            keyPassword   kPass
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Verifies the generated release APK certificate against the configured keystore.'
    dependsOn('packageRelease')

    doLast {
        def apk = layout.buildDirectory.file('outputs/apk/release/app-release.apk').get().asFile
        if (!apk.exists()) {
            throw new GradleException("release APK was not generated: ${apk.absolutePath}")
        }

        def executableName = System.getProperty('os.name').toLowerCase().contains('windows')
            ? 'apksigner.bat'
            : 'apksigner'
        def apksigner = new File(android.sdkDirectory,
            "build-tools/${android.buildToolsVersion}/${executableName}")
        if (!apksigner.exists()) {
            throw new GradleException("apksigner was not found for build tools ${android.buildToolsVersion}")
        }

        def stdout = new ByteArrayOutputStream()
        def stderr = new ByteArrayOutputStream()
        def result = project.exec {
            commandLine apksigner.absolutePath, 'verify', '--print-certs', apk.absolutePath
            standardOutput = stdout
            errorOutput = stderr
            ignoreExitValue = true
        }
        if (result.exitValue != 0) {
            throw new GradleException("release APK signature verification failed: ${stderr.toString('UTF-8').trim()}")
        }

        def matcher = stdout.toString('UTF-8') =~ /(?m)^Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]{64})\s*$/
        if (!matcher.find()) {
            throw new GradleException('release APK SHA-256 certificate digest was not reported by apksigner')
        }
        def actual = matcher.group(1).toUpperCase().replaceAll(/(..)(?!$)/, '$1:')
        def releaseSigning = android.signingConfigs.release
        def expected = keystoreSha256(
            releaseSigning.storeFile,
            releaseSigning.storePassword,
            releaseSigning.keyAlias
        )

        logger.lifecycle("[signing] release SHA-256=${actual}")
        if (actual != expected) {
            throw new GradleException(
                "release APK signing certificate mismatch: actual=${actual}, keystore=${expected}"
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'assembleRelease') {
        task.dependsOn(verifyReleaseSigning)
    }
}

